name: Apply smooth zoom fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-smooth-zoom-and-queue-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch 4K image motion renderer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('production/render_episode_hq.py')
          text=path.read_text(encoding='utf-8')
          start=text.index('def render_image_segment(')
          end=text.index('\ndef safe_video_seconds(', start)
          new='''def render_image_segment(asset: RenderAsset, seconds: float, out: Path, motion_index: int) -> None:
    # Render a complete Ken Burns move from one supersampled source frame.
    # A single source frame + 4x supersampling prevents integer crop rounding from
    # becoming visible micro-jitter in the final 3840x2160 image.
    frames = max(2, int(round(seconds * FPS)))
    denom = max(1, frames - 1)
    t = f"(on/{denom})"
    smooth = f"(3*{t}*{t}-2*{t}*{t}*{t})"
    if motion_index % 2 == 0:
        zoom = f"1.0+0.04*{smooth}"
        motion = "zoom_in_smooth"
    else:
        zoom = f"1.04-0.04*{smooth}"
        motion = "zoom_out_smooth"

    super_w = OUTPUT_W * 4
    super_h = OUTPUT_H * 4
    vf = (
        f"scale={super_w}:{super_h}:force_original_aspect_ratio=increase:flags=lanczos,"
        f"crop={super_w}:{super_h},"
        f"zoompan=z='{zoom}':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':"
        f"d={frames}:s={OUTPUT_W}x{OUTPUT_H}:fps={FPS},"
        "format=yuv420p"
    )
    run([
        "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
        "-loop", "1", "-i", str(asset.path),
        "-vf", vf, "-frames:v", str(frames), "-an", "-c:v", "libx264",
        "-preset", "veryfast", "-crf", "20", "-r", str(FPS), "-pix_fmt", "yuv420p", str(out),
    ])
    out.with_suffix(".motion").write_text(motion, encoding="utf-8")

'''
          current=text[start:end]
          if 'zoom_in_smooth' in current and 'd={frames}' in current:
              print('Smooth zoom renderer already installed.')
          else:
              path.write_text(text[:start]+new+text[end+1:],encoding='utf-8')
              print('Smooth zoom renderer installed.')
          PY
          python -m py_compile production/render_episode_hq.py production/render_episode.py

      - name: Commit renderer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NBA Stars Factory'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add production/render_episode_hq.py
          if git diff --cached --quiet; then
            echo 'Renderer already patched.'
            exit 0
          fi
          git commit -m 'fix(render): eliminate 4K still-image zoom jitter'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
