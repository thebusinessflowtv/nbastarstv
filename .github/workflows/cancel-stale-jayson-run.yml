name: Cancel stale Jayson run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-jayson-run.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale pre-fix run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel 36271202091 --repo "${{ github.repository }}" || true
          echo 'Stale pre-fix Jayson run cancellation requested.'
