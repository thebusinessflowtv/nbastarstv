name: Archive Luka 4K Output

on:
  push:
    paths:
      - '.github/workflows/archive-luka-output.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore completed Luka production
        uses: actions/download-artifact@v4
        with:
          pattern: tbf-production-d41a3f39-6192-47ae-a25c-a56ef73cd970-*
          path: restored
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36218036439
      - name: Validate and prepare saved files
        shell: bash
        run: |
          set -euo pipefail
          test -s restored/rendered/final.mp4
          test -s restored/rendered/thumbnail.png
          PACKAGE="$(find restored/output -type f -name episode-package.json | head -n 1)"
          test -s "$PACKAGE"
          python - "$PACKAGE" <<'PY'
          import json, sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          script=str(d.get('script') or '').strip()
          if not script: raise SystemExit('Missing script')
          Path('restored/rendered/script.txt').write_text(script+'\n',encoding='utf-8')
          PY
      - name: Save original 4K video as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-video-d41a3f39-6192-47ae-a25c-a56ef73cd970-${{ github.run_id }}
          path: restored/rendered/final.mp4
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Save thumbnail as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-thumbnail-d41a3f39-6192-47ae-a25c-a56ef73cd970-${{ github.run_id }}
          path: restored/rendered/thumbnail.png
          if-no-files-found: error
          retention-days: 90
      - name: Save script as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-script-d41a3f39-6192-47ae-a25c-a56ef73cd970-${{ github.run_id }}
          path: restored/rendered/script.txt
          if-no-files-found: error
          retention-days: 90
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build 1080p HLS playback proxy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf restored/rendered/hls
          mkdir -p restored/rendered/hls
          ffmpeg -hide_banner -loglevel error -y \
            -i restored/rendered/final.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -vf 'scale=-2:1080' \
            -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p \
            -g 120 -keyint_min 120 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 48000 \
            -f hls -hls_time 5 -hls_list_size 0 -hls_segment_type mpegts \
            -hls_segment_filename 'restored/rendered/hls/seg-%05d.ts' \
            restored/rendered/hls/index.m3u8
          test -s restored/rendered/hls/index.m3u8
          echo "Playback proxy segments: $(find restored/rendered/hls -name 'seg-*.ts' | wc -l)"
          du -sh restored/rendered/hls
      - name: Store Luka HLS stream privately
        env:
          MFCC_PRODUCTION_ID: d41a3f39-6192-47ae-a25c-a56ef73cd970
          MFCC_HLS_DIR: restored/rendered/hls
          MFCC_STREAM_RESOLUTION: 1920x1080
        run: node tools/mfcc_upload_hls.mjs
      - name: Store Luka thumbnail
        env:
          MFCC_PRODUCTION_ID: d41a3f39-6192-47ae-a25c-a56ef73cd970
          MFCC_OUTPUT_KIND: thumbnail
          MFCC_OUTPUT_FILE: restored/rendered/thumbnail.png
        run: node tools/mfcc_upload_output.mjs
      - name: Store Luka script
        env:
          MFCC_PRODUCTION_ID: d41a3f39-6192-47ae-a25c-a56ef73cd970
          MFCC_OUTPUT_KIND: script
          MFCC_OUTPUT_FILE: restored/rendered/script.txt
        run: node tools/mfcc_upload_output.mjs
