name: Archive Luka 4K Output

on:
  push:
    paths:
      - '.github/workflows/archive-luka-output.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore completed Luka production
        uses: actions/download-artifact@v4
        with:
          pattern: tbf-production-d41a3f39-6192-47ae-a25c-a56ef73cd970-*
          path: restored
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36218036439
      - name: Validate and prepare saved files
        shell: bash
        run: |
          set -euo pipefail
          test -s restored/rendered/final.mp4
          test -s restored/rendered/thumbnail.png
          PACKAGE="$(find restored/output -type f -name episode-package.json | head -n 1)"
          test -s "$PACKAGE"
          python - "$PACKAGE" <<'PY'
          import json, sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          script=str(d.get('script') or '').strip()
          if not script:
              raise SystemExit('Missing script')
          Path('restored/rendered/script.txt').write_text(script+'\n',encoding='utf-8')
          PY
          echo "Recovered validated Luka production files."
      - name: Save 4K video
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-video-d41a3f39-6192-47ae-a25c-a56ef73cd970-${{ github.run_id }}
          path: restored/rendered/final.mp4
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Save thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-thumbnail-d41a3f39-6192-47ae-a25c-a56ef73cd970-${{ github.run_id }}
          path: restored/rendered/thumbnail.png
          if-no-files-found: error
          retention-days: 90
      - name: Save script
        uses: actions/upload-artifact@v4
        with:
          name: mfcc-script-d41a3f39-6192-47ae-a25c-a56ef73cd970-${{ github.run_id }}
          path: restored/rendered/script.txt
          if-no-files-found: error
          retention-days: 90
