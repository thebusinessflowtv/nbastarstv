name: Cancel Duplicate Luka Run

on:
  push:
    paths:
      - '.github/workflows/cancel-duplicate-luka-run.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel duplicate production run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/36220614761/cancel")"
          if [ "$status" = "202" ] || [ "$status" = "409" ]; then
            echo "Duplicate run cancellation handled (HTTP $status)."
            exit 0
          fi
          cat /tmp/body
          exit 1
