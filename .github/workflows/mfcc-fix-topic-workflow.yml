name: MFCC Fix Topic Workflow

on:
  push:
    paths:
      - '.github/workflows/mfcc-fix-topic-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify topic workflow model env
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/mfcc-topic-intelligence.yml')
          s=p.read_text()
          s=s.replace("ANTHROPIC_RESEARCH_MODEL: ${{ vars.ANTHROPIC_RESEARCH_MODEL || 'claude-haiku-4-5-20251001' }}", "ANTHROPIC_RESEARCH_MODEL: claude-haiku-4-5-20251001")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'MediaForge Bot'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add .github/workflows/mfcc-topic-intelligence.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix NBA topic intelligence workflow validation'
          git push
