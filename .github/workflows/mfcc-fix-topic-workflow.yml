name: MFCC Fix Topic Workflow

on:
  push:
    paths:
      - '.github/workflows/mfcc-fix-topic-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify topic workflow model env
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/mfcc-topic-intelligence.yml')
          lines=p.read_text().splitlines()
          out=[]
          changed=False
          for line in lines:
              if line.lstrip().startswith('ANTHROPIC_RESEARCH_MODEL:'):
                  indent=line[:len(line)-len(line.lstrip())]
                  out.append(indent+'ANTHROPIC_RESEARCH_MODEL: claude-haiku-4-5-20251001')
                  changed=True
              else:
                  out.append(line)
          if not changed:
              raise SystemExit('model env line not found')
          p.write_text('\n'.join(out)+'\n')
          PY
      - name: Commit fix
        run: |
          git config user.name 'MediaForge Bot'
          git config user.email 'thebusinessflowtv@gmail.com'
          git add .github/workflows/mfcc-topic-intelligence.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix NBA topic intelligence workflow validation'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
